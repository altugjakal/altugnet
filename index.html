<!DOCTYPE html>
<html dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>My Site</title>
    <meta name="description" content="Site Description">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="My Site">
    <meta property="og:description" content="Site Description">
    
    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="My Site">
    <meta name="twitter:description" content="Site Description">

    <style>
        html, body, #main {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(255, 253, 241);
        }

        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif !important;
        }

        h1, h2, h3, h4, h5, h6, p, figure {
            margin: 0;
        }

        body, input, textarea, select, button {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }

        .site-container {
            height: min-content;
            background-color: #fffdf1;
            flex-flow: column;
            place-content: center flex-start;
            align-items: center;
            gap: 0;
            width: 1200px;
            padding: 0;
            display: flex;
            position: relative;
            margin: 0 auto;
        }

        .identity-opening {
            max-width: 1200px;
            height: min-content;
            flex-flow: column;
            flex: none;
            place-content: center flex-start;
            align-items: center;
            gap: 0;
            width: 100%;
            padding: 64px 72px 32px;
            display: flex;
            position: relative;
        }

        .identity-row {
            flex-flow: row;
            flex: none;
            place-content: center space-between;
            align-items: center;
            width: 100%;
            height: min-content;
            padding: 0;
            display: flex;
            position: relative;
        }

        .wordmark h1 {
            font-size: 46px;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1em;
            color: rgb(16, 16, 16);
        }

        .descriptor p {
            font-size: 21px;
            font-weight: 600;
            line-height: 1.1em;
            color: rgb(16, 16, 16);
        }

        .info-delivery {
            flex-flow: row;
            flex: none;
            place-content: center;
            align-items: center;
            gap: 92px;
            width: 100%;
            max-width: 1200px;
            height: min-content;
            padding: 104px 140px 118px;
            display: flex;
            position: relative;
        }

        .daisy-image {
            height: 408px;
            flex: none;
            width: 306px;
            position: relative;
        }

        .editorial-copy {
            flex-flow: column;
            flex: none;
            place-content: flex-start;
            align-items: flex-start;
            gap: 26px;
            width: 360px;
            height: min-content;
            padding: 0;
            display: flex;
            position: relative;
        }

        .systems-excerpt p {
            line-height: 1.32em;
            color: #101010;
        }

        .orange-field {
            height: 300px;
            background-color: #ffaf1c;
            flex: none;
            width: 260px;
            position: relative;
        }

        .project-statement {
            white-space: pre-wrap;
            word-break: break-word;
            flex: none;
            width: 100%;
            max-width: 760px;
            height: auto;
            position: relative;
        }

        .project-statement h2 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.25em;
            color: rgb(16, 16, 16);
        }

        .projects-nav {
            flex-flow: row;
            flex: none;
            place-content: center;
            align-items: center;
            gap: 0;
            width: 100%;
            max-width: 1200px;
            height: min-content;
            padding: 118px 140px 96px;
            display: flex;
            position: relative;
        }

        .nav-field {
            background-color: #de3833;
            flex-flow: column;
            flex: none;
            place-content: flex-start;
            align-items: flex-start;
            gap: 14px;
            width: 620px;
            height: 430px;
            padding: 62px 56px;
            display: flex;
            position: relative;
        }

        .nav-field a {
            font-size: 25px;
            font-weight: 700;
            line-height: 1.1em;
            color: rgb(255, 253, 241);
            text-decoration: none;
        }

        .turtle-image {
            height: 420px;
            flex: none;
            width: 420px;
            position: relative;
        }

        .yellow-field {
            height: 250px;
            background-color: #f2d610;
            flex: none;
            width: 270px;
            position: relative;
        }

        @media (max-width: 1199.98px) {
            .site-container { gap: 4px; width: 390px; }
            .identity-opening { padding: 34px 24px 18px; }
            .identity-row { flex-direction: column; place-content: flex-start; align-items: flex-start; gap: 12px; }
            .descriptor { white-space: pre-wrap; word-break: break-word; width: 100%; }
            .info-delivery { flex-direction: column; justify-content: flex-start; gap: 30px; padding: 58px 24px 72px; }
            .daisy-image { width: 100%; height: 430px; }
            .editorial-copy { width: 100%; }
            .orange-field { width: 230px; height: 230px; }
            .project-statement { width: 342px; }
            .projects-nav { flex-direction: column; justify-content: flex-start; padding: 0 24px 56px; }
            .nav-field { width: 100%; height: 260px; padding: 34px 30px; }
            .turtle-image { width: 100%; height: 320px; }
            .yellow-field { width: 75%; height: 180px; }
        }
    </style>
</head>
<body>
    <div id="main">
        <div class="site-container" style="min-height: 100vh;">
            
            <div class="identity-opening">
                <div class="identity-row">
                    <div class="wordmark">
                        <h1>altugnet</h1>
                    </div>
                    <div class="descriptor">
                        <p>information delivery systems</p>
                    </div>
                </div>
            </div>

            <div class="info-delivery">
                <div class="daisy-image">
                    <img src="https://framerusercontent.com/images/UTFs2hb9opFIzGGrMPHzSaSB4.jpg?width=900&amp;height=1200" alt="White daisy against a blue field" style="display:block;width:100%;height:100%;object-fit:cover;" loading="lazy">
                </div>
                <div class="editorial-copy">
                    <div class="systems-excerpt">
                        <p>Knowledge is out there, and we make it not only reachable, but also continuous.</p>
                    </div>
                    <div class="orange-field"></div>
                </div>
            </div>

            <div class="project-statement">
                <h2>Our projects aim to make access to information more practical</h2>
            </div>

            <div class="projects-nav">
                <div class="nav-field">
                    <div>
                        <p><a href="./index.html">Home</a></p>
                    </div>
                    <div>
                        <p><a href="https://boomerang.altugnet.org/" target="_blank">Boomerang</a></p>
                    </div>
                </div>
                <div class="turtle-image">
                    <img src="https://framerusercontent.com/images/yNDtAVTuAqQDAgsOjVx2fecqtAg.jpg?width=1200&amp;height=841" alt="Sea turtle underwater" style="display:block;width:100%;height:100%;object-fit:cover;" loading="lazy">
                </div>
                <div class="yellow-field"></div>
            </div>

        </div>
    </div>
</body>
</html>
